name: Deploy React App to NAS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy production frontend
    runs-on: ubuntu-latest

    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Configure production environment
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Only main can deploy to production: ${GITHUB_REF_NAME}"
            exit 1
          fi

          printf '%s\n' "${{ secrets.ENV_PROD }}" > .env.production
          printf '%s\n' "${{ secrets.ENV_PROD }}" > .env
          source .env
          echo "EC2_HOST=${{ secrets.EC2_HOST_PROD }}" >> "$GITHUB_ENV"

          normalize_synology_paths() {
            local source_path="$1"
            case "$source_path" in
              /volume1/*)
                SSH_PATH="$source_path"
                SFTP_PATH="${source_path#/volume1}"
                ;;
              /docker/*)
                SSH_PATH="/volume1${source_path}"
                SFTP_PATH="$source_path"
                ;;
              *)
                SSH_PATH="$source_path"
                SFTP_PATH="$source_path"
                ;;
            esac
          }

          normalize_synology_paths "$DOCKER_FRONT_DIRECTORY"
          echo "DOCKER_FRONT_DIRECTORY_SSH=${SSH_PATH}" >> "$GITHUB_ENV"
          echo "DOCKER_FRONT_DIRECTORY_SFTP=${SFTP_PATH}" >> "$GITHUB_ENV"

          normalize_synology_paths "$DOCKER_NGINX_DIRECTORY"
          echo "DOCKER_NGINX_DIRECTORY_SSH=${SSH_PATH}" >> "$GITHUB_ENV"
          echo "DOCKER_NGINX_DIRECTORY_SFTP=${SFTP_PATH}" >> "$GITHUB_ENV"

      - name: Build React app
        run: |
          npm run build -- --mode production
          test -d dist

      - name: Validate deployment files
        run: |
          required_files=(
            docker-compose.yml
            dist
            Dockerfile
            nginx
            .env
            ext_nginx/docker-compose.yml
            ext_nginx/nginx.conf
          )
          for file in "${required_files[@]}"; do
            test -e "$file" || { echo "Missing deployment file: $file"; exit 1; }
          done

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOF > ~/.ssh/config
          Host synology-nas
            HostName ${{ env.EC2_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}
            StrictHostKeyChecking no
            User ${{ secrets.EC2_USERNAME }}
            IdentityFile ~/.ssh/id_rsa
          EOF
          chmod 600 ~/.ssh/config

      - name: Test tunnel connection
        run: ssh -F ~/.ssh/config synology-nas "echo SSH OK"

      - name: Prepare deployment directories
        run: |
          ssh -F ~/.ssh/config synology-nas "
            set -eu
            mkdir -p '${{ env.DOCKER_FRONT_DIRECTORY_SSH }}'
            mkdir -p '${{ env.DOCKER_NGINX_DIRECTORY_SSH }}'
          "

      - name: Transfer frontend files
        run: |
          scp -F ~/.ssh/config -r \
            docker-compose.yml dist Dockerfile nginx .env \
            "synology-nas:${{ env.DOCKER_FRONT_DIRECTORY_SFTP }}/"
          scp -F ~/.ssh/config -r ext_nginx \
            "synology-nas:${{ env.DOCKER_NGINX_DIRECTORY_SFTP }}/"
          scp -F ~/.ssh/config .env \
            "synology-nas:${{ env.DOCKER_NGINX_DIRECTORY_SFTP }}/"

      - name: Deploy frontend and nginx
        run: |
          ssh -F ~/.ssh/config synology-nas << 'EOF'
            set -eu
            export PATH="/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin:/opt/bin:/opt/sbin:/var/packages/Docker/target/usr/bin:$PATH"

            COMPOSE_IS_V2=0
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_V1="$(command -v docker-compose)"
            else
              for p in /var/packages/Docker/target/usr/bin/docker-compose /usr/local/bin/docker-compose /usr/bin/docker-compose /bin/docker-compose; do
                [ -x "$p" ] && COMPOSE_V1="$p" && break
              done
            fi
            if [ -z "${COMPOSE_V1:-}" ]; then
              if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
                COMPOSE_IS_V2=1
              else
                echo "docker-compose is not available"
                exit 1
              fi
            fi
            compose() {
              if [ "$COMPOSE_IS_V2" -eq 1 ]; then
                docker compose "$@"
              else
                "$COMPOSE_V1" "$@"
              fi
            }

            FRONT_DIR="${{ env.DOCKER_FRONT_DIRECTORY_SSH }}"
            NGINX_DIR="${{ env.DOCKER_NGINX_DIRECTORY_SSH }}"

            if [ -d "$NGINX_DIR/ext_nginx" ]; then
              cp -f "$NGINX_DIR/ext_nginx/docker-compose.yml" "$NGINX_DIR/docker-compose.yml"
              cp -f "$NGINX_DIR/ext_nginx/nginx.conf" "$NGINX_DIR/nginx.conf"
              rm -f "$NGINX_DIR/ext_nginx/docker-compose.yml" "$NGINX_DIR/ext_nginx/nginx.conf"
              rmdir "$NGINX_DIR/ext_nginx"
            fi

            cd "$FRONT_DIR"
            compose -f docker-compose.yml stop || true
            compose -f docker-compose.yml rm -f || true
            docker stop pickteam-react-container 2>/dev/null || true
            docker rm pickteam-react-container 2>/dev/null || true
            compose -f docker-compose.yml up -d --build

            cd "$NGINX_DIR"
            compose -f docker-compose.yml stop || true
            compose -f docker-compose.yml rm -f || true
            docker stop pickteam-nginx-container 2>/dev/null || true
            docker rm pickteam-nginx-container 2>/dev/null || true
            compose -f docker-compose.yml up -d --build

            cd "$FRONT_DIR"
            compose -f docker-compose.yml ps
            cd "$NGINX_DIR"
            compose -f docker-compose.yml ps
          EOF
