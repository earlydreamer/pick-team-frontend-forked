name: renewal build check

# 리뉴얼 브랜치 전용 빌드 검사. 배포 단계와 운영 시크릿은 없다.
on:
  push:
    branches:
      - codex/frontend-redesign
  pull_request:
    branches:
      - codex/frontend-redesign
  workflow_dispatch:

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: |
          npm run build
          test -d dist
