<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6667AB">
  <title>PickTeam — 좋은 팀이 좋은 결과를 만든다</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            // 08. 컬러 시스템 (Very Peri) 정본 반영
            peri: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              200: '#C7D2FE',
              300: '#A5B4FC',
              400: '#818CF8', // Primary Light (#818CF8)
              500: '#6667AB', // Key Brand Very Peri (#6667AB / #6366F1)
              600: '#4F46E5', // Primary Dark (#4F46E5)
              700: '#4338CA',
              800: '#312E81',
              900: '#1E1B4B',
              950: '#15172E',
            },
            secondary: {
              light: '#DDD6FE',
              DEFAULT: '#A78BFA', // Secondary (#A78BFA)
              dark: '#7C3AED',
            },
            accent: {
              light: '#E0F2FE',
              DEFAULT: '#38BDF8', // Accent (#38BDF8)
              dark: '#0284C7',
            },
            success: {
              light: '#DCFCE7',
              DEFAULT: '#10B981', // Success (#10B981)
              dark: '#059669',
            },
            warning: {
              light: '#FEF3C7',
              DEFAULT: '#F59E0B', // Warning (#F59E0B)
              dark: '#D97706',
            },
            error: {
              light: '#FEE2E2',
              DEFAULT: '#EF4444', // Error (#EF4444)
              dark: '#DC2626',
            },
            primary: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              200: '#C7D2FE',
              light: '#818CF8',
              DEFAULT: '#6667AB',
              dark: '#4F46E5',
              deeper: '#3730A3',
            },
            ink: {
              primary: '#0F172A',   // Gray 900 (#0F172A)
              secondary: '#334155', // Gray 700 (#334155)
              tertiary: '#64748B',  // Gray 500 (#64748B)
              muted: '#94A3B8',
            },
            surface: {
              canvas: '#F8FAFC',    // Gray 50 (#F8FAFC)
              sidebar: '#1B1D36',
              card: '#FFFFFF',
              subtle: '#F1F5F9',    // Gray 100 (#F1F5F9)
              inset: '#E2E8F0',
            },
            neutral: {
              50: '#F8FAFC',
              100: '#F1F5F9',
              200: '#E2E8F0',
              300: '#CBD5E1',       // Gray 300 (#CBD5E1)
              400: '#94A3B8',
              500: '#64748B',       // Gray 500 (#64748B)
              600: '#475569',
              700: '#334155',       // Gray 700 (#334155)
              800: '#1E293B',
              900: '#0F172A',       // Gray 900 (#0F172A)
            }
          },
          boxShadow: {
            'craft-sm': '0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04)',
            'craft-md': '0 4px 14px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04)',
            'craft-lg': '0 12px 32px -4px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.06)',
            'peri-glow': '0 4px 14px 0 rgba(102, 103, 171, 0.32)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/src/index.css">
</head>
<body class="bg-surface-canvas text-ink-primary antialiased selection:bg-peri-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
